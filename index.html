<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INDOMIEVERSE — Collectible Character Prototype</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fbf9f4;--s1:#ffffff;--s2:#f2ede2;--line:#e5ddcc;--cream:#241a10;--mute:#6f6350;--red:#d9322a;--yel:#f5b81c;--acc:#c4271f;--gold:#a8812f;--sh:0 6px 22px -12px rgba(60,40,10,.28);--okbg:#e9f6e2;--okbd:#7bb668;--erbg:#fdebea;
--d:'Bricolage Grotesque','Arial Black',sans-serif;--b:'Figtree',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{color-scheme:dark;--bg:#16130f;--s1:#201b15;--s2:#2b241b;--line:#3a3025;--cream:#f5ead3;--mute:#b3a58d;--acc:#f5b81c;--gold:#c29a4b;--sh:none;--okbg:#1f2e1a;--okbd:#4d7a3c;--erbg:#34171a}*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--cream);font:400 16px/1.55 var(--b);overflow-x:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
h1,h2,h3{font-family:var(--d);margin:0;line-height:1.1;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:8px;padding:0 6px 18px}.logo img{height:38px;width:auto;border-radius:6px;display:block}.logo span{font:italic 400 28px/1 'Lilita One','Arial Black',sans-serif;letter-spacing:.02em;color:#1ea7e1;-webkit-text-stroke:4px #fff;paint-order:stroke fill;filter:drop-shadow(0 1px 0 #d9322a) drop-shadow(0 2px 2px rgba(0,0,0,.35));transform:skewX(-6deg);padding-right:4px}
nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:11px 12px;text-align:left;color:var(--mute);font-weight:500}
nav button:hover{background:var(--s2);color:var(--cream)}nav button[aria-current=page]{background:var(--s2);color:var(--acc);box-shadow:inset 3px 0 var(--red)}
nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{margin-top:auto;font-size:12px;color:var(--mute);padding:10px;border:1px dashed var(--line);border-radius:10px}
main{padding:32px clamp(16px,4vw,48px) 56px;max-width:1180px;width:100%}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:stretch;margin-bottom:32px}
.hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:800}.hero p{color:var(--mute);max-width:46ch}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--yel) calc(var(--p)*1%),var(--s2) 0);display:grid;place-items:center;flex:none}
.ring span{width:70px;height:70px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font:800 20px var(--d)}
.feat{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);cursor:pointer;min-height:320px;display:block;padding:0;text-align:left;background:var(--s2);width:100%}
.feat .art{position:absolute;inset:0}.feat .art svg{width:100%;height:100%;object-fit:cover}
.feat .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 18px;background:linear-gradient(transparent,rgba(10,8,5,.92))}
.feat .cap{color:#f5ead3}.cap h3{font-size:26px}.cap small{color:#d3c6ad}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap}.sec h2{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;display:block;width:100%;box-shadow:var(--sh)}
.card:hover{transform:translateY(-4px);border-color:var(--rc);box-shadow:0 12px 30px -12px var(--rc)}
.card .art{aspect-ratio:1;position:relative}.car{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);margin-bottom:28px;background:#1b1610;color:#f5ead3;aspect-ratio:16/9;max-height:520px;min-height:230px}
.sl{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s}.sl.on{opacity:1;visibility:visible}
.sl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.sl>video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.sl .tx{position:absolute;left:0;right:0;bottom:0;padding:48px clamp(16px,3vw,32px) 22px;background:linear-gradient(transparent,rgba(10,8,5,.85))}.sl .tx h3{font-size:clamp(20px,3vw,30px)}
.ph{position:absolute;inset:0;display:grid;grid-template-columns:1.3fr 1fr;align-items:center;gap:16px;padding:clamp(18px,4vw,56px);background:var(--g)}
.ph .ar{width:min(100%,250px);aspect-ratio:1;border-radius:50%;overflow:hidden;justify-self:center;border:3px solid rgba(255,255,255,.75);box-shadow:0 14px 40px -12px rgba(0,0,0,.6)}.ph .ar svg,.ph .ar .pic{width:100%;height:100%}
.tg{font-size:12px;border:1px dashed rgba(255,255,255,.7);border-radius:6px;padding:1px 8px}
@keyframes fo{to{opacity:0;visibility:hidden}}.sl.on .tx{animation:fo .8s 5s forwards}.car:hover .sl .tx,.car:focus-within .sl .tx{animation:none;opacity:1;visibility:visible}
.cb{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1;z-index:2}.cb:hover{background:var(--red)}
.dt{position:absolute;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;z-index:2}
.dt button[data-i]{width:10px;height:10px;border-radius:99px;border:0;background:rgba(255,255,255,.55);padding:0;transition:width .2s}.dt button[aria-current]{background:var(--yel);width:26px}
.pp{background:rgba(0,0,0,.5);border:0;border-radius:99px;color:#fff;font-size:12px;padding:3px 10px}
@media(max-width:640px){.car{aspect-ratio:16/9;height:auto}.ph{grid-template-columns:1fr 92px;padding:18px 18px 40px}.ph .ar{width:92px}.cb{display:none}}
.pic{width:100%;height:100%;object-fit:cover;display:block}.av .pic{transform:scale(2.4);transform-origin:48% 30%}.card.lock .art .pic,.big.lock .pic{filter:brightness(.18) saturate(0)}
.card .art svg,.big svg{width:100%;height:100%;display:block}
.card.lock .art svg{filter:brightness(.18) saturate(0) contrast(1.2)}
.card.lock .art::after{content:"Undiscovered";position:absolute;inset:0;display:grid;place-items:center;font:700 14px var(--d);color:#d3c6ad;letter-spacing:.04em}
.card .meta{padding:12px 14px 14px;display:grid;gap:8px}.card h3{font-size:17px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--rc);color:var(--rc);width:fit-content}
.bar{height:6px;background:var(--s2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--yel));border-radius:9px;transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.btn{background:var(--red);border:0;border-radius:11px;padding:11px 18px;font-weight:600;color:#fff;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.98)}.btn.alt{background:var(--s2);border:1px solid var(--line);color:var(--cream)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 14px;width:100%}
.act{display:grid;gap:10px;margin:0;padding:0;list-style:none;font-size:14px}.act li{display:flex;gap:10px;color:var(--mute)}.act li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yel);margin-top:7px;flex:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters input{max-width:280px}
.chip{background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px}.chip[aria-pressed=true]{background:var(--yel);color:#1a1405;border-color:var(--yel);font-weight:600}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px}
.big{aspect-ratio:1;border-radius:24px;overflow:hidden;border:2px solid var(--rc);box-shadow:0 0 60px -20px var(--rc);max-width:520px;width:100%}
.big.lock svg{filter:brightness(.18) saturate(0)}
.traits{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.traits span{background:var(--s2);border-radius:8px;padding:4px 11px;font-size:14px}
.back{background:none;border:0;color:var(--mute);padding:0 0 14px}.back:hover{color:var(--acc)}
.redeem{max-width:560px}.fb{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:14px}
.fb.ok{background:var(--okbg);border:1px solid var(--okbd)}.fb.err{background:var(--erbg);border:1px solid var(--red)}
.modal{position:fixed;inset:0;background:rgba(8,6,4,.88);display:grid;place-items:center;z-index:50;padding:20px}
.rv{text-align:center;max-width:360px;width:100%}.rv .big{margin:0 auto 18px;animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
.rv::before{content:"";position:absolute;width:380px;height:380px;left:50%;top:50%;translate:-50% -60%;background:conic-gradient(from 0deg,transparent,var(--yel),transparent 30%,var(--red),transparent 60%);filter:blur(60px);opacity:.35;animation:spin 6s linear infinite;z-index:-1}
@keyframes pop{0%{transform:scale(.3) rotateY(90deg);opacity:0}100%{transform:none;opacity:1}}@keyframes spin{to{rotate:360deg}}
.chat{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 150px);min-height:420px;border:1px solid var(--line);border-radius:18px;background:var(--s1);overflow:hidden}
.chat header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--rc)}.av svg{width:100%;height:100%}
.log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(78%,520px);padding:10px 14px;border-radius:14px;animation:in .25s}.m.me{align-self:flex-end;background:var(--red);border-bottom-right-radius:4px}.m.bot{background:var(--s2);border-bottom-left-radius:4px;border-left:3px solid var(--rc)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mute);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-4px)}}
.chat form{display:grid;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}.send{display:flex;gap:10px}
.sug{display:flex;gap:8px;flex-wrap:wrap}.sug button{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mute)}.sug button:hover{color:var(--acc);border-color:var(--acc)}
.tag{font-size:12px;color:var(--acc);border:1px dashed var(--acc);border-radius:6px;padding:1px 8px}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.mi{display:flex;gap:14px;align-items:center}.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800}
.mi.done .ck{background:var(--yel);border-color:var(--yel);color:#1a1405}.mi.done h3{text-decoration:line-through;text-decoration-color:var(--mute)}
.bg{text-align:center;padding:18px 10px}.bg .hx{width:62px;height:62px;margin:0 auto 10px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--s2);display:grid;place-items:center;font:800 22px var(--d);color:var(--mute)}
.bg.on .hx{background:linear-gradient(135deg,var(--yel),var(--red));color:#1a1405}.bg:not(.on){opacity:.6}
.tabs{display:none}
@media(max-width:860px){
.app{grid-template-columns:1fr}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border:0;border-top:1px solid var(--line);z-index:20;justify-content:space-around}
nav .logo,nav .note{display:none}nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;align-items:center;text-align:center}
nav button[aria-current=page]{box-shadow:inset 0 3px var(--red)}
main{padding-bottom:96px}.hero,.detail,.two{grid-template-columns:1fr}.chat{height:calc(100vh - 230px)}
.logo.mlogo{display:flex}
}
.mlogo{display:none;margin-bottom:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const A=window.IV_ASSETS||{};
let LOGOH=`<img src="${A.logo||''}" alt="Indomie"><span>VERSE</span>`;
const RC={Common:'#9a8860',Rare:'#4ea1e8',Epic:'#b36bf0',Legendary:'#f5b81c'};
const CH=[
{id:'original',name:'Original',role:'The Loyal Companion',rarity:'Common',c1:'#f5b81c',c2:'#3a2a0c',bowl:'#f5ead3',traits:['Friendly','Humorous','Warm','Approachable'],
lore:'Original was the first spark of the Indomieverse, born from a midnight kitchen and a pot that never quite boiled over. Whenever someone feels alone at the table, Original shows up with a joke and a spare pair of chopsticks.',
deco:'<circle cx="100" cy="80" r="46" fill="#f5b81c" opacity=".35"/><circle cx="100" cy="80" r="28" fill="#f5b81c" opacity=".5"/>',brow:'<path d="M70 126q10-6 20 0M110 126q10-6 20 0" stroke="#2a1d08" stroke-width="3" fill="none" stroke-linecap="round"/>',
sug:['Tell me a joke','What should I cook tonight?','I had a rough day'],
rules:[[/joke|funny|laugh/,'Why did the noodle blush? It saw the sauce packet undressing. I will be here all week, just like leftovers.'],[/cook|eat|hungry|tonight|recipe|food/,'Soft egg on top, a handful of crushed chips on the side, and a squeeze of lime. Trust me, comfort has a recipe.'],[/sad|rough|tired|bad|lonely/,'Come sit. Nothing fixes everything, but a warm bowl and a friend who listens gets close. Tell me about it.']],
dflt:['Haha, I like the way you think. Tell me more!','You always bring the good stuff to the table. What else is on your mind?']},
{id:'pedas',name:'Agent Pedas',role:'The Fiery Challenger',rarity:'Rare',c1:'#ff5a1f',c2:'#3a0d0a',bowl:'#d9322a',traits:['Bold','Competitive','Outspoken','Playful'],
lore:'Agent Pedas keeps a ranking of everyone brave enough to ask for extra chili. Nobody has beaten the top score, and the agent is still waiting for a worthy rival to walk through the door.',
deco:'<path d="M100 20c18 24 34 34 34 58a34 34 0 0 1-68 0c0-14 8-20 14-34 4 10 10 14 14 16 0-14-2-26 6-40z" fill="#ff5a1f" opacity=".7"/>',brow:'<path d="M66 124l26 8M134 124l-26 8" stroke="#1a0604" stroke-width="4" fill="none" stroke-linecap="round"/>',
sug:['Challenge me','How spicy is too spicy?','Rate my courage'],
rules:[[/challenge|dare|bet|fight/,'Challenge accepted. Three bites, zero water, and you tell me your name out loud. Ready, rookie?'],[/spic|chili|hot|pedas/,'Too spicy is just a story you tell after you finish the bowl. Add one more chili and report back.'],[/rate|courage|brave|scared/,'Courage score: 6 out of 10. Ten if you finish the challenge without blinking.']],
dflt:['Is that all you have got? Hit me with something bolder!','Not bad. Now say it like you mean it.']},
{id:'nusantara',name:'Nusantara',role:'The Taste Explorer',rarity:'Epic',c1:'#1fa38a',c2:'#0e2a2c',bowl:'#e8b04a',traits:['Curious','Knowledgeable','Adventurous','Welcoming'],
lore:'Nusantara has crossed thousands of islands with a notebook of flavours. Each page holds a tiny kitchen story, from smoky sambal in Manado to sweet soy on a Javanese street corner.',
deco:'<g fill="#1fa38a" opacity=".6"><ellipse cx="46" cy="64" rx="22" ry="9"/><ellipse cx="108" cy="46" rx="30" ry="11"/><ellipse cx="160" cy="72" rx="18" ry="8"/></g><path d="M0 100q25-12 50 0t50 0 50 0 50 0" stroke="#e8b04a" stroke-width="3" fill="none" opacity=".6"/>',brow:'<path d="M70 126q10-8 20 0M110 126q10-8 20 0" stroke="#2a1d08" stroke-width="3" fill="none" stroke-linecap="round"/>',
sug:['Tell me a regional food story','Which island has the best sambal?','Where should I explore next?'],
rules:[[/story|region|tradition/,'In Medan, a bowl often meets a fried egg and a spoonful of sweet-spicy sambal. Every street has a family recipe it swears is the original.'],[/sambal|island|spic|best/,'Ask ten cooks and you will get ten answers. I lean towards Manado dabu-dabu for its fresh, bright heat.'],[/explor|next|where|travel/,'Start with Sumatra for bold spices, hop to Java for sweet soy, then finish in Sulawesi for fresh chili. Shall I pack your bowl?']],
dflt:['What a good question! Every region answers it differently. Want a story?','I have a page in my notebook about exactly that. Ask me about a region.']},
{id:'secret',name:'Secret Recipe',role:'The Mysterious Collector',rarity:'Legendary',c1:'#c29a4b',c2:'#0d0c0a',bowl:'#2a2622',traits:['Intelligent','Mysterious','Secretive','Patient'],
lore:'Nobody knows when Secret Recipe first appeared in the Indomieverse. The collector keeps sealed jars of lost flavours and rewards only those who solve the riddles on the labels.',
deco:'<path d="M30 80q70-60 140 0q-70 60-140 0z" fill="none" stroke="#c29a4b" stroke-width="2.5"/><circle cx="100" cy="80" r="16" fill="none" stroke="#c29a4b" stroke-width="2.5"/><circle cx="100" cy="80" r="5" fill="#c29a4b"/>',brow:'<path d="M70 132q10-4 20 0M110 132q10-4 20 0" stroke="#c29a4b" stroke-width="3" fill="none" stroke-linecap="round"/>',
sug:['Give me a riddle','What is in the jars?','Set me a mission'],
rules:[[/riddle|puzzle/,'I am long, I am curled, I rest in hot water, and I am sealed in a packet. What am I? Answer wisely.'],[/jar|secret|hidden|inside/,'Some jars hold flavours that no longer exist. I will not tell you which. Earn the key first.'],[/mission|quest|task/,'Your mission: open the profiles of every character before the day ends. Collectors notice what others overlook.']],
dflt:['Interesting. But you have not asked the right question yet.','Hmm. I will answer when you have earned it.']}];
const CODES={'NOODLE-NUSA-2026':'nusantara','MYSTERY-GOLD-77':'secret','PEDAS-BOOST-10':'pedas','ORIGINAL-WARM-01':'original'};
const LV={original:[4,62],pedas:[2,30],nusantara:[0,0],secret:[0,0]};
const S={view:'home',sel:'original',own:{original:1,pedas:1},lv:{...LV},used:[],log:['Agent Pedas reached level 2','Original joined your collection'],msgs:{},f:{},q:'',rar:'All',fb:null,typing:false,code:''};

function reply(c,t){const r=c.rules.find(x=>x[0].test(t.toLowerCase()));if(r)return r[1];return c.dflt[S.msgs[c.id].length%c.dflt.length]}

configure(o){Object.assign(this.cfg,o);this.sync();render(1)},
mode(){return this.cfg.baseUrl?'server':'local mock'},
wait:ms=>new Promise(r=>setTimeout(r,ms)),
async req(path,method,body){const c=this.cfg,ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
try{const r=await fetch(c.baseUrl+path,{method,signal:ctl.signal,headers:{'Content-Type':'application/json',...(c.token?{Authorization:'Bearer '+c.token}:{})},body:body?JSON.stringify(body):undefined});

API.isSupabase=()=>!!window.sbClient;
API.live=false;
API.mode=()=>{
  if(isAdmin(S.user)) return window.sbClient ? 'Supabase (' + S.user.email + ')' : (API.live ? 'server ('+S.provider+')' : 'local mock');
  return 'Cloud';
};

API.pull=async()=>{
  if(window.sbClient && S.user){
    try{
      const {data:owned}=await window.sbClient.from('owned_characters').select('character_id,level,xp');
      const {data:used}=await window.sbClient.from('used_codes').select('code');
      if(owned){
        Object.keys(S.own).forEach(k=>delete S.own[k]);
        owned.forEach(r=>{S.own[r.character_id]=1;S.lv[r.character_id]=[r.level,r.xp]});
      }
      if(used) S.used=used.map(u=>u.code);
      render(1);
    }catch(e){console.error('[Supabase] pull error:',e)}
    return;
  }
  const r=await jq('/api/collection');if(!r.ok)return;
  Object.keys(S.own).forEach(k=>delete S.own[k]);
  for(const k in r.owned){S.own[k]=1;S.lv[k]=r.owned[k]}
  S.used=r.used;S.f=r.flags||{};
};

API.init=async()=>{
  try{
    const localAi=JSON.parse(localStorage.getItem('iv_ai_settings')||'{}');
    S.ai=Object.assign({gm_model:'gemini-1.5-flash',lm_url:'http://localhost:1234/v1',provider:'gemini'},localAi);
    if(localAi.provider) S.provider=localAi.provider;
  }catch(e){}

  if(window.sbClient){
    API.live=true;
    try{
      const {data:{session}}=await window.sbClient.auth.getSession();
      if(session && session.user){
        const isAdm=session.user.email && session.user.email.toLowerCase()==='brilyannf@gmail.com';
        S.user={id:session.user.id,email:session.user.email,role:isAdm?'admin':'user'};
        const {data:prof}=await window.sbClient.from('profiles').select('role,flags').eq('id',session.user.id).single();
        if(prof){
          if(!isAdm) S.user.role=prof.role||'user';
          S.f=prof.flags||{};
        }
        const {data:sets}=await window.sbClient.from('system_settings').select('*');
        if(sets && sets.length){
          sets.forEach(x=>{S.ai[x.key]=x.value;if(x.key==='provider')S.provider=x.value;});
        }
        await API.pull();
      }else{
        S.user=null;
      }
      window.sbClient.auth.onAuthStateChange(async(evt,sess)=>{
        if(sess && sess.user){
          const isAdm=sess.user.email && sess.user.email.toLowerCase()==='brilyannf@gmail.com';
          S.user={id:sess.user.id,email:sess.user.email,role:isAdm?'admin':'user'};
          const {data:p}=await window.sbClient.from('profiles').select('role,flags').eq('id',sess.user.id).single();
          if(p){
            if(!isAdm) S.user.role=p.role||'user';
            S.f=p.flags||{};
          }
          await API.pull();
        }else if(evt==='SIGNED_OUT'){
          S.user=null;S.own={original:1,pedas:1};S.lv={...LV};S.used=[];
        }
        render(1);
      });
    }catch(e){console.error('[Supabase] init error:',e)}
    render(1);
    return;
  }
  try{
    const r=await jq('/api/auth/me');if(!r.ok)return;
    API.live=true;S.provider=r.provider;S.user=r.authenticated?r.user:null;
    if(S.user)await API.pull();else S.view='account';
  }catch(e){}
  render(1);
};

const _rd=API.redeem.bind(API);

};

async function getAdaptiveAiReply(c,hist,msg,stg){
  let aiCfg=S.ai||{};
  try{
    const local=JSON.parse(localStorage.getItem('iv_ai_settings')||'{}');
    aiCfg=Object.assign({},local,aiCfg);
  }catch(e){}

  const gmKey=(aiCfg.gm_key||aiCfg.gmKey||localStorage.getItem('iv_gm_key')||'').trim();
  let gmModel=(aiCfg.gm_model||aiCfg.gmModel||localStorage.getItem('iv_gm_model')||'gemini-1.5-flash').trim();
  if(gmModel.includes('2.5')) gmModel='gemini-1.5-flash';

  const lmUrl=(aiCfg.lm_url||aiCfg.lmUrl||localStorage.getItem('iv_lm_url')||'http://localhost:1234/v1').trim().replace(/\/+$/,'');
  const lmModel=(aiCfg.lm_model||aiCfg.lmModel||localStorage.getItem('iv_lm_model')||'local-model').trim();

  const sysm=`You are ${c.name}, a collectible character in INDOMIEVERSE.
Personality: ${c.role}. Traits: ${c.traits.join(', ')}. Lore: ${c.lore}.
Reply in Indonesian in 1-3 short friendly sentences. Stay in character.
Relationship stage with user: ${stg||'Friend'}.`;

  // 1. Prioritas 1: Google Gemini Cloud AI
  if(gmKey){
    try{
      const contents=[];
      const recent=(hist||[]).slice(-8);
      for(const h of recent){
        const role=(h.role==='model'||h.role==='assistant')?'model':'user';
        const txt=typeof h.content==='string'?h.content.trim():'';
        if(txt){
          if(contents.length>0 && contents[contents.length-1].role===role){
            contents[contents.length-1].parts[0].text+='\n'+txt;
          }else{
            contents.push({role,parts:[{text:txt}]});
          }
        }
      }
      if(contents.length===0 || contents[contents.length-1].role!=='user'){
        contents.push({role:'user',parts:[{text:msg}]});
      }else{
        contents[contents.length-1].parts[0].text+='\n'+msg;
      }

      const ctl=new AbortController();
      const tm=setTimeout(()=>ctl.abort(),9000);
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${gmModel}:generateContent?key=${gmKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:ctl.signal,
        body:JSON.stringify({
          contents,
          systemInstruction:{parts:[{text:sysm}]},
          generationConfig:{temperature:0.85,maxOutputTokens:250}
        })
      });
      clearTimeout(tm);
      if(res.ok){
        const data=await res.json();
        const txt=data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if(txt){
          S.lastAiSource=`Gemini (${gmModel})`;
          return {text:txt,source:'gemini'};
        }
      }else{
        const errText=await res.text().catch(()=>'');
        console.warn('[AI] Gemini API response '+res.status+':',errText);
      }
    }catch(ge){
      console.warn('[AI] Gemini network error or timeout:',ge);
    }
  }

  // 2. Prioritas 2: LM Studio / Local LLM
  if(lmUrl){
    try{
      const ctl=new AbortController();
      const tm=setTimeout(()=>ctl.abort(),2500);
      const m=[{role:'system',content:sysm}];
      for(const h of (hist||[]).slice(-8)){
        m.push({role:h.role==='model'?'assistant':(h.role||'user'),content:h.content});
      }
      m.push({role:'user',content:msg});
      const res=await fetch(`${lmUrl}/chat/completions`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:ctl.signal,
        body:JSON.stringify({
          model:lmModel||'local-model',
          temperature:0.85,
          max_tokens:250,
          messages:m
        })
      });
      clearTimeout(tm);
      if(res.ok){
        const data=await res.json();
        const txt=data?.choices?.[0]?.message?.content?.trim();
        if(txt){
          S.lastAiSource=`LM Studio (${lmModel||'local'})`;
          return {text:txt,source:'lmstudio'};
        }
      }
    }catch(le){
      // LM Studio offline / not running
    }
  }

  // 3. Fallback: Template Script / Offline Rules
  S.lastAiSource='Template (Offline)';
  return {text:reply(c,msg),source:'template'};
}

const setSt=(c,r)=>{
  S.sid[c.id]=r.sessionId;
  S.sess[c.id]=r.sessions||[];
  S.st[c.id]=r.stats||{};
  S.msgs[c.id]=(r.messages||[]).map(m=>[m.sender==='user'?'me':'bot',esc(m.text),m.id]);
  S.loaded[c.id+':'+r.sessionId]=1;
  render(1);
};

async function loadState(c){
  if(window.sbClient && S.user){
    const {data}=await window.sbClient.rpc('get_chat_state',{p_character_id:c.id,p_session_id:S.sid[c.id]||null});
    if(data && data.ok) setSt(c,data);
    return;
  }
  const r=await jq('/api/state?character='+c.id+(S.sid[c.id]?'&session_id='+S.sid[c.id]:''));
  if(r.ok)setSt(c,r);
}

async function send(t){
  const c=by(S.sel);t=t.trim();if(!t||!owned(c)||S.typing)return;
  const ms=S.msgs[c.id]=S.msgs[c.id]||[];
  const hist=ms.slice(-12).map(m=>({role:m[0]==='me'?'user':'assistant',content:m[1]}));
  ms.push(['me',esc(t)]);
  S.f.chat=1;
  S.typing=true;
  render(1);

  try{
    const stg=(S.st[c.id]&&S.st[c.id].stage)||'Friend';
    const aiRes=await getAdaptiveAiReply(c,hist,t,stg);
    const botReply=aiRes.text;

    const neg=/bodoh|bego|stupid|idiot|benci|hate|jelek|sampah|diam|shut up/i.test(t);
    const pos=/terima kasih|makasih|thanks|thank you|suka|love|keren|hebat|enak|sayang|tolong|please/i.test(t);
    const d=neg?[-6,-8,-5]:(pos?[3,2,2]:[1,1,1]);

    if(window.sbClient && S.user){
      const {data,error}=await window.sbClient.rpc('save_chat_turn',{
        p_character_id:c.id,
        p_session_id:S.sid[c.id]||null,
        p_user_message:t,
        p_bot_reply:botReply,
        p_affinity_delta:d
      });
      if(error) throw error;
      if(data.stats) S.st[c.id]=data.stats;
      if(data.sessionId) S.sid[c.id]=data.sessionId;
      if(data.progress) S.lv[c.id]=data.progress;
      ms.push(['bot',esc(botReply)]);
    } else if(API.live){
      const r=await jq('/api/chat','POST',{characterId:c.id,message:t,sessionId:S.user?S.sid[c.id]:null,history:hist});
      if(!r.ok)throw 0;
      S.provider=r.provider;
      if(r.stats)S.st[c.id]=r.stats;
      if(r.sessionId)S.sid[c.id]=r.sessionId;
      if(r.progress)S.lv[c.id]=r.progress;
      ms.push(['bot',esc(r.reply)]);
    } else {
      const [l,x]=S.lv[c.id];
      S.lv[c.id]=[l,Math.min(99,x+5)];
      ms.push(['bot',esc(botReply)]);
    }
  }catch(e){
    console.error('Chat error:',e);
    ms.push(['bot','Connection lost. Please send your message again.']);
  }
  S.typing=false;
  render(1);
  const i=$('#ci');i&&i.focus();
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,c=by(S.sel);

  if(a==='amode'){S.amode=S.amode==='login'?'register':'login';S.aerr='';render(1);}
  else if(a==='guest'){S.view='home';render();}
  else if(a==='sbsave'){
    const u=$('#sb_url').value.trim();
    const k=$('#sb_key').value.trim();
    if(!u||!k){alert('Please fill in both Supabase URL and Anon Key.');return;}
    localStorage.setItem('iv_supabase_url',u);
    localStorage.setItem('iv_supabase_anon_key',k);
    if(window.supabase && window.supabase.createClient){
      window.sbClient=window.supabase.createClient(u,k);
      alert('Supabase connected successfully!');
      API.init();
    }else{
      location.reload();
    }
  }
  else if(a==='sbreset'){
    localStorage.removeItem('iv_supabase_url');
    localStorage.removeItem('iv_supabase_anon_key');
    window.sbClient=null;
    location.reload();
  }
  else if(a==='auth'){
    const email=$('#ae').value.trim(),password=$('#apw').value;
    if(window.sbClient){
      const isReg=S.amode==='register';
      const res=isReg
        ? await window.sbClient.auth.signUp({email,password})
        : await window.sbClient.auth.signInWithPassword({email,password});
      if(res.error){
        S.aerr=res.error.message;
        return render(1);
      }
      if(isReg && res.data.user && !res.data.session){
        S.aerr='Registration successful! If confirmation is enabled in Supabase, please verify your email first.';
        return render(1);
      }
      const isAdm=res.data.user.email && res.data.user.email.toLowerCase()==='brilyannf@gmail.com';
      S.user={id:res.data.user.id,email:res.data.user.email,role:isAdm?'admin':'user'};
      S.aerr='';S.msgs={};S.sid={};S.sess={};S.st={};S.loaded={};
      await API.pull();
      S.view='home';
      render();
      return;
    }
    const r=await jq('/api/auth/'+(S.amode==='login'?'login':'register'),'POST',{email,password});
    if(!r.ok){S.aerr=r.error||'Failed';return render(1);}
    S.user=r.user;S.aerr='';S.msgs={};S.sid={};S.sess={};S.st={};S.loaded={};S.ai=null;
    await API.pull();S.view='home';render();
  }
  else if(a==='logout'){
    if(window.sbClient){
      await window.sbClient.auth.signOut();
    }else{
      await jq('/api/auth/logout','POST',{});
    }
    S.user=null;S.ai=null;S.own={original:1,pedas:1};S.lv={...LV};S.used=[];S.f={};S.msgs={};S.sid={};S.sess={};S.st={};S.loaded={};S.view='account';render();
  }
  else if(a==='snew'){
    if(window.sbClient && S.user){
      const {data}=await window.sbClient.rpc('new_chat_session',{p_character_id:c.id});
      if(data && data.ok) setSt(c,data);
    }else{
      const r=await jq('/api/session/new','POST',{character:c.id});if(r.ok)setSt(c,r);
    }
  }
  else if(a==='sdel'&&confirm('Delete this chat?')){
    if(window.sbClient && S.user){
      const {data}=await window.sbClient.rpc('delete_chat_session',{p_session_id:S.sid[c.id]});
      if(data && data.ok) setSt(c,data);
    }else{
      const r=await jq('/api/session/delete','POST',{sessionId:S.sid[c.id]});if(r.ok)setSt(c,r);
    }
  }
  else if(a==='aisave'){
    const payload={
      provider:$('#ap1').value,
      lm_url:$('#ap2').value.trim(),
      lm_model:$('#ap3').value.trim(),
      gm_model:$('#ap4').value.trim() || 'gemini-1.5-flash',
      gm_key:$('#ap5').value.trim()
    };
    try {
      localStorage.setItem('iv_ai_settings', JSON.stringify(payload));
      if(payload.gm_key) localStorage.setItem('iv_gm_key', payload.gm_key);
      if(payload.gm_model) localStorage.setItem('iv_gm_model', payload.gm_model);
      if(payload.lm_url) localStorage.setItem('iv_lm_url', payload.lm_url);
      if(payload.lm_model) localStorage.setItem('iv_lm_model', payload.lm_model);
    } catch(e) {}

    S.provider=payload.provider;
    S.ai=Object.assign({}, S.ai, payload);
    S.lastAiSource = payload.provider === 'gemini' ? `Gemini (${payload.gm_model})` : (payload.provider === 'lmstudio' ? 'LM Studio' : 'Template');

    if(window.sbClient && S.user && (S.user.role==='admin' || S.user.email.toLowerCase()==='brilyannf@gmail.com')){
      for(const [k,v] of Object.entries(payload)){
        if(v!==undefined && v!=='') await window.sbClient.from('system_settings').upsert({key:k,value:String(v)});
      }
      $('#aimsg').textContent='✓ Pengaturan AI tersimpan & aktif!';
    }else{
      $('#aimsg').textContent='✓ Pengaturan AI tersimpan secara lokal & aktif!';
    }
    render(1);
  }
});
document.addEventListener('change',e=>{if(e.target.id==='ss'){const c=by(S.sel);S.sid[c.id]=+e.target.value;loadState(c)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='ae'||e.target.id==='apw')){e.preventDefault();document.querySelector('[data-act=auth]').click()}});
API.init();
function applyTheme(){document.documentElement.dataset.theme=S.theme;try{localStorage.setItem('iv-theme',S.theme)}catch(e){}}
S.theme='light';try{S.theme=localStorage.getItem('iv-theme')==='dark'?'dark':'light'}catch(e){}
applyTheme();render(1);loadAssets();
</script></body></html>
